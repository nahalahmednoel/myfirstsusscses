<!DOCTYPE html>
<html lang="bn" data-theme="arcade">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0420">
<title>Personal Financial Portfolio Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --logo:'Pixelify Sans','Chakra Petch',sans-serif;
  --dis:'Chakra Petch','Hind Siliguri',system-ui,sans-serif;
  --body:'Hind Siliguri','Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#0b0420;--bg2:#1d0c42;--panel:rgba(26,12,58,.86);--line:#43307d;--depth:#05010f;
  --text:#f6f2ff;--muted:#a99bd6;--a1:#29f3ff;--a2:#ff3ea5;--a3:#ffe44d;--good:#31e39a;--bad:#ff4d6a;
  --pxs:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),0 9px 0 0 var(--depth),-3px 6px 0 0 var(--depth),3px 6px 0 0 var(--depth);
  --pxs-flat:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line);
}
[data-theme="gameboy"]{--bg:#0c1708;--bg2:#1b3010;--panel:rgba(22,40,14,.88);--line:#3f6127;--depth:#040902;--text:#eaffd2;--muted:#9fbf7c;--a1:#9bff4a;--a2:#37d67a;--a3:#ffe066;--good:#9bff4a;--bad:#ff7a4d}
[data-theme="synth"]{--bg:#18040f;--bg2:#3d0d2b;--panel:rgba(52,12,38,.86);--line:#7a2c60;--depth:#0a0206;--text:#fff0f6;--muted:#d19ab8;--a1:#ff9a3d;--a2:#ff3d8b;--a3:#ffe14d;--good:#4dffb0;--bad:#ff4d4d}
[data-theme="ice"]{--bg:#040c1e;--bg2:#0c2148;--panel:rgba(12,30,66,.86);--line:#2c4c86;--depth:#01040c;--text:#eef6ff;--muted:#93aed6;--a1:#7ce8ff;--a2:#9a86ff;--a3:#fff27a;--good:#4dffc3;--bad:#ff5c7a}
[data-theme="cloud"]{--bg:#eaeeff;--bg2:#dae1ff;--panel:rgba(255,255,255,.9);--line:#a9b5e8;--depth:#8793c9;--text:#171436;--muted:#575e8f;--a1:#3457ff;--a2:#e0247a;--a3:#e79a00;--good:#0a9c55;--bad:#d81f3a}
[data-theme="sand"]{--bg:#17120c;--bg2:#2e2415;--panel:rgba(44,35,21,.88);--line:#6b5630;--depth:#080602;--text:#fff6e4;--muted:#c3ae86;--a1:#ffc857;--a2:#ff7a45;--a3:#ffe9a8;--good:#8ddf7a;--bad:#ff5f5f}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden;font-size:16px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
img.pxi{image-rendering:pixelated;width:26px;height:26px;display:block;flex:none}
.dis{font-family:var(--dis);font-weight:600;font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* background */
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(100% 70% at 50% 0%,var(--bg2),var(--bg) 75%);overflow:hidden}
.sun{position:absolute;left:50%;bottom:36%;width:min(60vw,300px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;opacity:.4;
  background:repeating-linear-gradient(180deg,var(--a2) 0 14px,transparent 14px 20px),linear-gradient(var(--a3),var(--a2));
  -webkit-mask:linear-gradient(#000 45%,transparent);mask:linear-gradient(#000 45%,transparent);animation:sun 9s steps(9) infinite alternate}
@keyframes sun{to{transform:translateX(-50%) translateY(16px)}}
.floor{position:absolute;left:-60%;right:-60%;bottom:-6%;height:42%;
  background-image:linear-gradient(var(--a1) 2px,transparent 2px),linear-gradient(90deg,var(--a1) 2px,transparent 2px);
  background-size:56px 56px;transform:perspective(300px) rotateX(64deg);transform-origin:bottom;opacity:.22;
  -webkit-mask:linear-gradient(transparent,#000 55%);mask:linear-gradient(transparent,#000 55%);animation:floor 1.8s linear infinite}
@keyframes floor{to{background-position:0 56px}}
canvas.layer{position:fixed;inset:0;pointer-events:none}
#stars{z-index:-2}#confetti{z-index:90}#wipe{z-index:96}
#fly{position:fixed;inset:0;pointer-events:none;z-index:92}
.flyer{position:fixed;left:-18px;top:-18px;width:36px;height:36px;image-rendering:pixelated;will-change:transform}
.spk{position:fixed;width:8px;height:8px;left:0;top:0}

/* pixel primitives */
.px{position:relative;background:var(--panel);box-shadow:var(--pxs);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pb{--c:var(--a1);--cl:color-mix(in srgb,var(--c) 52%,#000);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;font-family:var(--dis);font-weight:700;font-size:15px;color:#12061f;background:var(--c);white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--cl),0 3px 0 0 var(--cl),-3px 0 0 0 var(--cl),3px 0 0 0 var(--cl),0 8px 0 0 var(--cl),-3px 5px 0 0 var(--cl),3px 5px 0 0 var(--cl),inset 0 4px 0 rgba(255,255,255,.32),inset 0 -4px 0 rgba(0,0,0,.2);
  transition:transform .1s steps(2),filter .2s}
.pb:hover{filter:brightness(1.12)}
.pb:active{transform:translateY(5px);box-shadow:var(--pxs-flat),inset 0 4px 0 rgba(0,0,0,.2)}
.pb.pink{--c:var(--a2)}.pb.gold{--c:var(--a3)}.pb.red{--c:var(--bad)}.pb.green{--c:var(--good)}
.pb.ghost{--c:var(--bg2);--cl:var(--line);color:var(--text)}
.pb.sm{padding:8px 12px;font-size:14px}
.field{width:100%;padding:11px 13px;background:var(--bg2);border:0;outline:0;box-shadow:var(--pxs-flat);font-family:var(--body)}
.field:focus{box-shadow:0 -3px 0 var(--a1),0 3px 0 var(--a1),-3px 0 0 var(--a1),3px 0 0 var(--a1)}
select.field option{background:var(--bg2)}

/* lock screen */
#lock{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:radial-gradient(90% 70% at 50% 10%,var(--bg2),var(--bg))}
.lockbox{width:min(420px,100%);padding:26px 22px;text-align:center}
.brand{font-family:var(--logo);font-size:clamp(34px,9vw,46px);line-height:1;color:var(--a3);text-shadow:3px 3px 0 var(--a2),6px 6px 0 var(--a1),9px 9px 0 var(--depth);animation:logoB 2.2s steps(4) infinite alternate}
@keyframes logoB{to{transform:translateY(-4px);text-shadow:3px 3px 0 var(--a1),6px 6px 0 var(--a2),9px 9px 0 var(--depth)}}
.tag{color:var(--muted);font-size:14px;margin:12px 0 18px}
.door{width:120px;height:120px;margin:4px auto 16px;position:relative;perspective:500px}
.door .plate{position:absolute;inset:0;background:var(--bg2);box-shadow:var(--pxs-flat);display:grid;place-items:center;transform-style:preserve-3d;transform-origin:left center;transition:transform .9s steps(9)}
.door.open .plate{transform:rotateY(-105deg)}
.door .wheel{width:64px;height:64px;background:conic-gradient(from 0deg,var(--a3) 0 8%,transparent 8% 25%,var(--a3) 25% 33%,transparent 33% 50%,var(--a3) 50% 58%,transparent 58% 75%,var(--a3) 75% 83%,transparent 83%);border-radius:50%;
  box-shadow:inset 0 0 0 8px var(--line),inset 0 0 0 12px var(--a3);animation:spinW 7s linear infinite}
@keyframes spinW{to{transform:rotate(360deg)}}
.door .inner{position:absolute;inset:0;background:radial-gradient(circle,var(--a3),transparent 70%);opacity:.35;z-index:-1}
.lockform{display:grid;gap:14px;text-align:left;margin-top:8px}
.lockform label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.lockrow{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--a1)}
.err{color:var(--bad);font-size:14px;min-height:22px}

/* layout */
.app{max-width:1060px;margin:0 auto;padding:16px 16px 200px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:nowrap}
.me{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.ava{width:50px;height:50px;flex:none;position:relative;background:var(--bg2);overflow:hidden;
  box-shadow:0 -3px 0 var(--a1),0 3px 0 var(--a2),-3px 0 0 var(--a1),3px 0 0 var(--a2)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava .ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--dis);font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a2));color:#12061f}
.hello{font-size:12px;color:var(--muted)}
.hname{font-family:var(--dis);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:relative;display:flex;padding:4px;background:var(--bg2);box-shadow:var(--pxs-flat);flex:none}
.seg button{position:relative;z-index:1;padding:6px 10px;font-family:var(--dis);font-weight:700;font-size:13px;color:var(--muted);transition:color .2s}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--a1);transition:transform .3s steps(5);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
#curSwitch[data-cur="USDT"] .knob{transform:translateX(100%)}
#curSwitch[data-cur="TK"] [data-c="TK"],#curSwitch[data-cur="USDT"] [data-c="USDT"]{color:#12061f}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;font-family:var(--dis);font-weight:700;font-size:13px;padding:0}

.tab{display:none}
.tab.active{display:block}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:30px 2px 14px;font-family:var(--dis);font-size:19px;font-weight:700}
.sec small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.sec a{color:var(--a1)}
.rise{animation:rise .45s steps(6) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.05fr;min-height:340px;overflow:hidden}
.hero.hit-up{animation:hitUp .7s steps(7)}
.hero.hit-down{animation:hitDown .6s steps(8)}
@keyframes hitUp{30%{box-shadow:0 -3px 0 var(--good),0 3px 0 var(--good),-3px 0 0 var(--good),3px 0 0 var(--good),0 0 60px -6px var(--good)}}
@keyframes hitDown{20%,60%{transform:translateX(-5px);box-shadow:0 -3px 0 var(--bad),0 3px 0 var(--bad),-3px 0 0 var(--bad),3px 0 0 var(--bad),0 0 60px -6px var(--bad)}40%,80%{transform:translateX(5px)}}
.hinfo{padding:24px 22px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2;min-width:0}
.lbl{color:var(--muted);font-size:14px}
.big{font-family:var(--dis);font-weight:700;font-size:clamp(30px,7vw,54px);margin:4px 0 2px;font-variant-numeric:tabular-nums;
  filter:drop-shadow(3px 3px 0 var(--depth))}
.delta{height:26px;font-family:var(--dis);font-weight:700;font-size:19px;opacity:0}
.delta.go{animation:delta 1.5s steps(10)}
@keyframes delta{0%{opacity:0;transform:translateY(14px)}18%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-18px)}}
.trend{display:flex;align-items:center;gap:8px;font-family:var(--dis);font-weight:700;font-size:15px;margin-bottom:8px}
.trend .arw{font-size:18px}
#spark{width:100%;height:56px;display:block;margin:2px 0 12px}
.goal{margin-bottom:14px}
.gbar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:14px}
.gbar i{background:var(--bg2);transition:background .12s}
.gbar i.on{background:var(--a1);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.gbar i.on:nth-child(n+9){background:color-mix(in srgb,var(--a1) 50%,var(--a2))}
.gbar i.on:nth-child(n+16){background:var(--a2)}
.gtxt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.gtxt b{font-family:var(--dis)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;padding:4px 9px;background:var(--bg2);box-shadow:0 -2px 0 var(--line),0 2px 0 var(--line),-2px 0 0 var(--line),2px 0 0 var(--line)}
.chip.good{color:var(--good)}.chip.bad{color:var(--bad)}
.bank{position:relative;min-height:320px;cursor:grab;touch-action:pan-y;background:radial-gradient(60% 60% at 50% 60%,color-mix(in srgb,var(--a1) 18%,transparent),transparent 70%)}
.bank:active{cursor:grabbing}
.bank canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.vhint{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:var(--muted);font-family:var(--dis)}
.nogl-coin{display:none;position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;image-rendering:pixelated;animation:spinY 2.6s steps(12) infinite}
.bank.nogl .nogl-coin{display:block}
@keyframes spinY{to{transform:rotateY(360deg)}}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.owe{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;transition:transform .15s steps(3)}
.owe:hover{transform:translateY(-4px)}
.owe .k{font-size:12.5px;color:var(--muted)}
.owe .v{font-family:var(--dis);font-weight:700;font-size:clamp(16px,3.4vw,22px)}

/* odometer */
.odo{display:inline-flex;white-space:pre;line-height:1.16;overflow:hidden;vertical-align:bottom;font-variant-numeric:tabular-nums}
.odo .dg{display:inline-block;height:1.16em;overflow:hidden}
.odo .st{display:flex;flex-direction:column;transition:transform .85s cubic-bezier(.2,1.2,.4,1)}
.odo .st i{font-style:normal;height:1.16em;line-height:1.16em;text-align:center}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{padding:15px}
.stat .top2{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tile{width:38px;height:38px;display:grid;place-items:center;background:var(--bg2);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.08)}
.stat .k{font-size:13.5px;color:var(--muted)}
.stat .v{font-family:var(--dis);font-weight:700;font-size:clamp(17px,3vw,23px)}
.stat.in .v{color:var(--good)}.stat.out .v{color:var(--bad)}
.stat.in .tile{background:color-mix(in srgb,var(--good) 22%,var(--bg2))}
.stat.out .tile{background:color-mix(in srgb,var(--bad) 22%,var(--bg2))}
.stat.pf .tile{background:color-mix(in srgb,var(--a3) 22%,var(--bg2))}
.flip{animation:flip .55s steps(6)}
@keyframes flip{50%{transform:perspective(500px) rotateX(85deg)}}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}

/* charts */
.chart{padding:14px 12px 8px;position:relative}
.chart canvas{width:100%;display:block;touch-action:pan-y}
.tip{position:absolute;top:8px;left:0;padding:8px 10px;font-size:12px;background:var(--bg);box-shadow:var(--pxs-flat);opacity:0;pointer-events:none;white-space:nowrap;z-index:3;transition:opacity .1s;font-family:var(--dis)}
.mkhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;padding:16px 16px 0}
.mkprice{font-family:var(--dis);font-weight:700;font-size:clamp(24px,5vw,34px)}
.mkchg{font-family:var(--dis);font-weight:700;font-size:15px}
.fseg{display:flex;gap:4px;padding:5px;background:var(--bg2);box-shadow:var(--pxs-flat);flex-wrap:wrap}
.fseg button{padding:6px 11px;font-family:var(--dis);font-weight:700;font-size:13.5px;color:var(--muted);transition:.15s}
.fseg button.on{background:var(--a1);color:#12061f;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}

/* lists */
.list{display:flex;flex-direction:column;gap:16px}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:8px 4px -6px;font-family:var(--dis)}
.tx{display:flex;align-items:center;gap:11px;padding:11px 13px;animation:slide .4s steps(6) both}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:600}
.tx .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:var(--dis);font-weight:700;white-space:nowrap}
.xbtn{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none;transition:.15s}
.xbtn:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.xbtn.rc:hover{color:var(--a1);background:color-mix(in srgb,var(--a1) 18%,transparent)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty img{width:52px;height:52px;margin:0 auto 10px;image-rendering:pixelated;animation:bob 1.2s steps(4) infinite alternate}
@keyframes bob{to{transform:translateY(-9px)}}
.out-anim{animation:outA .38s steps(5) forwards}
@keyframes outA{to{opacity:0;transform:translateX(50px) scale(.92)}}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px;align-items:center}
.toolbar .field{flex:1;min-width:150px;width:auto}

/* ledger */
.people{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.person{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px}
.person b{font-family:var(--dis)}
.pav{width:36px;height:36px;display:grid;place-items:center;font-family:var(--dis);font-weight:700;color:#12061f;flex:none;box-shadow:inset 0 4px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.2)}
.debt{padding:13px 15px;animation:slide .4s steps(6) both;overflow:hidden}
.debt .row{display:flex;align-items:center;gap:11px}
.debt .nm{font-weight:700;font-size:16px}
.debt .meta{font-size:12px;color:var(--muted)}
.debt .meta .od{color:var(--bad);font-weight:700}
.debt .amt{margin-left:auto;text-align:right;font-family:var(--dis);font-weight:700;font-size:19px}
.debt .amt small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:500}
.pbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:9px;margin:11px 0}
.pbar i{background:var(--bg2)}.pbar i.on{background:var(--good)}
.debt .acts{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.stamp{position:absolute;right:16px;top:50%;font-family:var(--dis);font-weight:700;font-size:30px;color:var(--good);padding:2px 10px;transform:translateY(-50%) rotate(-12deg);
  box-shadow:0 -4px 0 var(--good),0 4px 0 var(--good),-4px 0 0 var(--good),4px 0 0 var(--good);opacity:.85;pointer-events:none}
.stamp.new{animation:stamp .5s steps(5)}
@keyframes stamp{from{transform:translateY(-50%) rotate(-12deg) scale(3);opacity:0}}

/* report bits */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.kpi{padding:13px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--dis);font-weight:700;font-size:16px;margin-top:3px}
.donutbox{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;padding:18px}
.dwrap{position:relative;width:200px;height:200px;max-width:100%}
.dwrap canvas{width:100%;height:100%;image-rendering:pixelated}
.dcenter{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--muted)}
.dcenter b{font-family:var(--dis);font-size:16px;color:var(--text);display:block}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.lg{display:flex;align-items:center;gap:9px;font-size:13.5px}
.lg i{width:13px;height:13px;flex:none}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-family:var(--dis);font-size:12.5px}
.twrap{overflow-x:auto;padding:6px}
table{width:100%;min-width:430px;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px;font-size:12.5px}
td{padding:9px;border-top:2px dashed var(--line)}
.n{text-align:right;font-family:var(--dis);font-variant-numeric:tabular-nums}
tr.zero td{opacity:.38}
tr.today td{background:color-mix(in srgb,var(--a1) 12%,transparent)}

/* profile */
.pcard{padding:0 18px 22px;text-align:center;overflow:hidden}
.cover{height:100px;margin:0 -18px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:300% 100%;animation:cover 7s steps(28) infinite;
  -webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent)}
@keyframes cover{to{background-position:300% 0}}
.pcard .ava{width:112px;height:112px;margin:-56px auto 10px;cursor:pointer;overflow:visible}
.pcard .ava img,.pcard .ava .ph{position:relative;z-index:1}
.cam{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;display:grid;place-items:center;background:var(--a3);z-index:2;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 var(--depth)}
.pname{font-family:var(--dis);font-weight:700;font-size:25px}
.psub{color:var(--muted);font-size:13.5px}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.form{display:grid;gap:16px;padding:18px}
.form label{display:grid;gap:7px;font-size:13.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:18px}
.th{display:grid;gap:7px;justify-items:center;padding:9px 5px;font-family:var(--dis);font-weight:600;font-size:12.5px;background:var(--bg2);transition:transform .15s steps(3)}
.th:hover{transform:translateY(-4px)}
.th.on{box-shadow:0 -3px 0 var(--a1),0 3px 0 var(--a1),-3px 0 0 var(--a1),3px 0 0 var(--a1)}
.sw{width:100%;height:26px;display:grid;grid-template-columns:repeat(3,1fr)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px}
.note{padding:0 18px 18px;font-size:13px;color:var(--muted)}

/* fab + nav */
.fab{position:fixed;right:max(16px,calc(50% - 512px));bottom:100px;z-index:40;width:62px;height:62px;font-size:32px;padding:0}
.fab::after{content:"";position:absolute;inset:-12px;box-shadow:var(--pxs-flat);animation:ping 1.8s steps(6) infinite;pointer-events:none}
@keyframes ping{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.3)}}
.bnav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:39;display:flex;gap:2px;padding:6px;width:min(540px,calc(100% - 24px))}
.bnav button{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 2px;font-size:11px;color:var(--muted);transition:.15s;min-width:0}
.bnav button img{width:24px;height:24px;image-rendering:pixelated;transition:transform .3s steps(3)}
.bnav button.on{color:var(--text);background:var(--bg2);box-shadow:inset 0 -3px 0 var(--a1)}
.bnav button.on img{animation:hop .6s steps(3) infinite alternate}
@keyframes hop{from{transform:translateY(-2px) scale(1.1)}to{transform:translateY(-6px) scale(1.15)}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.modal.open{display:flex}
.sheet{width:min(540px,100%);max-height:88vh;overflow:auto;padding:20px;animation:pxIn .35s steps(6)}
@keyframes pxIn{from{clip-path:inset(50% 50% 50% 50%)}to{clip-path:inset(-20px)}}
.sheet h2{font-family:var(--dis);font-size:23px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.two button{padding:13px 8px;font-family:var(--dis);font-weight:700;font-size:15px;background:var(--bg2);box-shadow:var(--pxs-flat);transition:.15s}
.two button.on.g{background:color-mix(in srgb,var(--good) 25%,var(--bg2));box-shadow:0 -3px 0 var(--good),0 3px 0 var(--good),-3px 0 0 var(--good),3px 0 0 var(--good);color:var(--good)}
.two button.on.r{background:color-mix(in srgb,var(--bad) 25%,var(--bg2));box-shadow:0 -3px 0 var(--bad),0 3px 0 var(--bad),-3px 0 0 var(--bad),3px 0 0 var(--bad);color:var(--bad)}
.amtbox{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;margin-bottom:6px;background:var(--bg2);box-shadow:var(--pxs-flat)}
.amtbox input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--dis);font-weight:700;font-size:30px}
.amtbox select{background:var(--bg);border:0;padding:8px;font-family:var(--dis);font-weight:700}
.conv{font-size:12.5px;color:var(--muted);min-height:20px;margin:0 4px 14px;font-family:var(--dis)}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.cat{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;font-size:13.5px;background:var(--bg2);transition:transform .12s steps(2)}
.cat.on{background:color-mix(in srgb,var(--a1) 28%,var(--bg2));box-shadow:0 -2px 0 var(--a1),0 2px 0 var(--a1),-2px 0 0 var(--a1),2px 0 0 var(--a1);transform:translateY(-3px)}
.quick{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mstack{display:grid;gap:12px;margin-bottom:16px}
.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-top:4px}
.rcptwrap{text-align:center;margin-bottom:16px}
#rcptImg{max-width:100%;width:340px;image-rendering:auto;box-shadow:0 10px 0 var(--depth)}
.toast{position:fixed;left:50%;top:14px;z-index:99;padding:11px 16px;font-weight:600;max-width:92vw;transform:translate(-50%,-160%);transition:transform .35s steps(6);font-size:14px}
.toast.show{transform:translate(-50%,0)}

@media(max-width:820px){
  .hero{grid-template-columns:1fr}
  .bank{min-height:250px;order:-1}
  .hinfo{padding:8px 18px 20px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .wide{grid-column:span 2}
  .kpis{grid-template-columns:1fr 1fr}
  .themes{grid-template-columns:repeat(3,1fr)}
  .donutbox{grid-template-columns:1fr;justify-items:center}
  .legend{width:100%}
}
@media(max-width:520px){
  body{font-size:15px}
  .app{padding:12px 12px 200px}
  .hello{display:none}
  .hname{font-size:16px}
  .ava{width:44px;height:44px}
  .iconbtn{width:40px;height:40px}
  .btns{grid-template-columns:1fr}
  .owe{flex-direction:column;align-items:flex-start;gap:4px}
  .row2{grid-template-columns:1fr}
  .duo{gap:16px}
  .fab{width:56px;height:56px;font-size:28px;bottom:94px}
}
@media(max-width:400px){
  .top{gap:6px}
  .seg{padding:3px}
  .seg button{padding:5px 6px;font-size:11px}
  .seg .knob{top:3px;bottom:3px;left:3px;width:calc(50% - 3px)}
  .iconbtn{width:36px;height:36px}
  .iconbtn img{width:20px;height:20px}
  .bnav button{font-size:10px}
  .bnav button img{width:22px;height:22px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LOCK SCREEN -->

      <div class="stat px pf wide"><div class="top2"><div class="tile" data-ic="🏆"></div><span class="k" data-i18n="mPf"></span></div><div class="v odo" id="mPf"></div></div>

/* ================= SHA-256 + AUTH ================= */
function sha256(ascii){
  function rr(n, x){ return (x >>> n) | (x << (32-n)); }
  const K = [];
  const H = [];
  let primeCounter = 0;
  const isComposite = {};
  for(let candidate = 2; primeCounter < 64; candidate++){
    if(!isComposite[candidate]){
      for(let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      if(primeCounter < 8) H[primeCounter] = (Math.pow(candidate, .5) * 4294967296) | 0;
      K[primeCounter++] = (Math.pow(candidate, 1/3) * 4294967296) | 0;
    }
  }
  const bytes = new TextEncoder().encode(ascii);
  const words = [];
  const len = bytes.length * 8;
  const padded = [...bytes, 0x80];
  while(padded.length % 64 !== 56) padded.push(0);
  for(let i = 0; i < padded.length; i += 4) words.push((padded[i] << 24) | (padded[i+1] << 16) | (padded[i+2] << 8) | padded[i+3]);
  words.push(Math.floor(len / 4294967296), len | 0);
  const hash = H.slice();
  const w = new Array(64);
  for(let j = 0; j < words.length; j += 16){
    for(let i = 0; i < 16; i++) w[i] = words[j+i] | 0;
    for(let i = 16; i < 64; i++){
      const s0 = rr(7, w[i-15]) ^ rr(18, w[i-15]) ^ (w[i-15] >>> 3);
      const s1 = rr(17, w[i-2]) ^ rr(19, w[i-2]) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = hash;
    for(let i = 0; i < 64; i++){
      const S1 = rr(6,e) ^ rr(11,e) ^ rr(25,e);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(2,a) ^ rr(13,a) ^ rr(22,a);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => hash[i] = (hash[i] + v) | 0);
  }
  return hash.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}
const hashPass = (u, p, salt) => sha256(salt + '::' + u.toLowerCase().trim() + '::' + p);
function setAuth(u, p, remember){
  const salt = uid() + uid();
  auth = {user: u.trim(), salt, hash: hashPass(u, p, salt)};
  localStorage.setItem(AKEY, JSON.stringify(auth));
  if(remember) localStorage.setItem(RKEY, '1'); else localStorage.removeItem(RKEY);
}

function dayMap(){
  const m = {};
  for(const x of S.txs){ const d = m[x.date] || (m[x.date] = {inc:0, exp:0}); x.type === 'in' ? d.inc += x.amt : d.exp += x.amt; }
  return m;
}
function lastDays(n, m){
  const out = [], now = new Date();
  for(let i = n-1; i >= 0; i--){ const d = dstr(addDays(now, -i)), v = m[d] || {inc:0, exp:0}; out.push({d, inc:v.inc, exp:v.exp, pf:v.inc-v.exp}); }
  return out;
}
function monthSum(ym, m){
  let inc = 0, exp = 0, best = null;
  for(const [d, v] of Object.entries(m)){
    if(!d.startsWith(ym)) continue;
    inc += v.inc; exp += v.exp;
    const pf = v.inc - v.exp;
    if(pf > 0 && (!best || pf > best.pf)) best = {d, pf};
  }
  return {inc, exp, pf:inc-exp, best};
}
const remain = d => Math.max(0, d.amt - (d.paid||0));
const openDebts = () => S.debts.filter(d => remain(d) > 0.004);
function totals(){
  let inc = 0, exp = 0;
  for(const x of S.txs) x.type === 'in' ? inc += x.amt : exp += x.amt;
  return {inc, exp, pf:inc-exp, bal:(Number(S.profile?.startBal)||0) + inc - exp};
}
const coinTarget = bal => bal <= 0 ? 0 : clamp(Math.round(Math.log10(bal+1)*8 - 8), 1, 48);

/* build daily OHLC series of the balance */
function buildSeries(){
  const p = S.profile || {};
  const txs = [...S.txs].sort((a, b) => a.date.localeCompare(b.date) || (a.ts||0) - (b.ts||0));
  let startDate = p.start || (txs[0] ? txs[0].date : today());
  if(txs.length && txs[0].date < startDate) startDate = txs[0].date;
  const byDay = {};
  txs.forEach(x => (byDay[x.date] = byDay[x.date] || []).push(x));
  let bal = Number(p.startBal) || 0;
  const out = [];
  let d = parseD(startDate);
  const end = parseD(today());
  if(d > end) d = end;
  let guard = 0;
  while(d <= end && guard++ < 1400){
    const ds = dstr(d), list = byDay[ds] || [];
    const o = bal;
    let h = bal, l = bal, inc = 0, exp = 0;
    for(const x of list){
      bal += x.type === 'in' ? x.amt : -x.amt;
      x.type === 'in' ? inc += x.amt : exp += x.amt;
      h = Math.max(h, bal); l = Math.min(l, bal);
    }
    out.push({d:ds, o, h, l, c:bal, inc, exp, pf:inc-exp});
    d = addDays(d, 1);
  }
  if(!out.length) out.push({d:today(), o:bal, h:bal, l:bal, c:bal, inc:0, exp:0, pf:0});
  return out;
}
function tfSlice(series){
  const tf = S.settings.tf;
  if(tf === 'all') return series.slice(-365);
  return series.slice(-Number(tf));
}
function movingAvg(arr, n){
  const out = [];
  for(let i = 0; i < arr.length; i++){
    if(i < n-1){ out.push(null); continue; }
    let s = 0; for(let j = i-n+1; j <= i; j++) s += arr[j].c;
    out.push(s/n);
  }
  return out;
}

/* ================= CHARTS ================= */
function setup(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.max(1, Math.round(w*dpr)); cv.height = Math.max(1, Math.round(h*dpr));
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  return {c, w, h};
}
function animate(dur, fn){
  if(reduce){ fn(1); return; }
  const t0 = performance.now();
  const f = now => { const p = Math.min(1, (now-t0)/dur); fn(Math.floor(p*14)/14); if(p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function drawSpark(days){
  const cv = $('#spark');
  cv.style.height = '56px';
  const {c, w, h} = setup(cv);
  if(!w) return;
  const vals = days.map(x => x.c), mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn) || 1;
  const X = i => i/(days.length-1 || 1)*(w-4) + 2, Y = v => h - 6 - (v-mn)/rg*(h-14);
  const up = vals[vals.length-1] >= vals[0], col = up ? cssVar('--good') : cssVar('--bad');
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, col + '66'); g.addColorStop(1, col + '00');
  c.beginPath(); c.moveTo(X(0), h);
  vals.forEach((v, i) => c.lineTo(X(i), Y(v)));
  c.lineTo(X(vals.length-1), h); c.closePath(); c.fillStyle = g; c.fill();
  c.beginPath(); vals.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
  c.strokeStyle = col; c.lineWidth = 2; c.stroke();
  c.fillStyle = col; c.fillRect(X(vals.length-1)-3, Y(vals[vals.length-1])-3, 6, 6);
}
function drawCandles(view, full){
  const cv = $('#candle');
  const ma = S.settings.ma ? movingAvg(full, 7).slice(-view.length) : null;
  const run = k => {
    const {c, w, h} = setup(cv);
    if(!w) return;
    const P = {l:8, r:66, t:12, b:22}, iw = w-P.l-P.r, ih = h-P.t-P.b;
    const lo = Math.min(...view.map(x => x.l)), hi = Math.max(...view.map(x => x.h));
    const padv = (hi-lo)*.12 || Math.max(1, Math.abs(hi)*.1);
    const mn = lo-padv, mx = hi+padv, rg = (mx-mn) || 1;
    const Y = v => P.t + ih - (v-mn)/rg*ih;
    const slot = iw/view.length, bw = Math.max(2, Math.min(18, slot*.62));
    const good = cssVar('--good'), bad = cssVar('--bad'), line = cssVar('--line'), mut = cssVar('--muted'), a3 = cssVar('--a3'), txt = cssVar('--text');
    c.strokeStyle = line; c.lineWidth = 1; c.font = '11px "Chakra Petch",sans-serif'; c.fillStyle = mut; c.textAlign = 'left';
    for(let i = 0; i <= 4; i++){
      const y = Math.round(P.t + ih/4*i) + .5, v = mx - rg/4*i;
      c.setLineDash([3,4]); c.beginPath(); c.moveTo(P.l, y); c.lineTo(P.l+iw, y); c.stroke(); c.setLineDash([]);
      c.fillText(shortMoney(v), P.l+iw+6, y+4);
    }
    const n = Math.max(1, Math.ceil(view.length*k));
    if(S.settings.mode === 'line'){
      const col = view[n-1].c >= view[0].o ? good : bad;
      const g = c.createLinearGradient(0, P.t, 0, P.t+ih);
      g.addColorStop(0, col+'55'); g.addColorStop(1, col+'00');
      c.beginPath(); c.moveTo(P.l, P.t+ih);
      for(let i = 0; i < n; i++) c.lineTo(P.l + slot*i + slot/2, Y(view[i].c));
      c.lineTo(P.l + slot*(n-1) + slot/2, P.t+ih); c.closePath(); c.fillStyle = g; c.fill();
      c.beginPath();
      for(let i = 0; i < n; i++){ const x = P.l + slot*i + slot/2, y = Y(view[i].c); i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = col; c.lineWidth = 2; c.stroke();
    } else {
      for(let i = 0; i < n; i++){
        const d = view[i], x = Math.round(P.l + slot*i + (slot-bw)/2), cx = Math.round(P.l + slot*i + slot/2);
        const up = d.c >= d.o, col = up ? good : bad;
        c.fillStyle = col;
        c.fillRect(cx-1, Math.round(Y(d.h)), 2, Math.max(1, Math.round(Y(d.l)-Y(d.h))));
        const y1 = Y(Math.max(d.o, d.c)), y2 = Y(Math.min(d.o, d.c));
        c.fillRect(x, Math.round(y1), Math.max(2, bw), Math.max(2, Math.round(y2-y1)));
      }
    }
    if(ma){
      c.beginPath(); let started = false;
      for(let i = 0; i < n; i++){
        if(ma[i] == null) continue;
        const x = P.l + slot*i + slot/2, y = Y(ma[i]);
        started ? c.lineTo(x, y) : (c.moveTo(x, y), started = true);
      }
      c.strokeStyle = a3; c.lineWidth = 1.5; c.setLineDash([5,3]); c.stroke(); c.setLineDash([]);
    }
    const lastY = Y(view[n-1].c);
    c.strokeStyle = a3; c.setLineDash([4,4]); c.beginPath(); c.moveTo(P.l, lastY); c.lineTo(P.l+iw, lastY); c.stroke(); c.setLineDash([]);
    c.fillStyle = a3; c.fillRect(P.l+iw+2, lastY-9, P.r-4, 18);
    c.fillStyle = '#12061f'; c.font = '700 11px "Chakra Petch",sans-serif'; c.textAlign = 'center';
    c.fillText(shortMoney(view[n-1].c), P.l+iw+2+(P.r-4)/2, lastY+4);
    c.fillStyle = mut; c.font = '11px "Chakra Petch",sans-serif'; c.textAlign = 'center';
    [0, Math.floor(view.length/2), view.length-1].forEach(i => {
      if(i >= n) return;
      c.fillText(parseD(view[i].d).toLocaleDateString(loc(), {day:'numeric', month:'short'}), clamp(P.l+slot*i+slot/2, 30, P.l+iw-30), h-6);
    });
    if(cv._hover >= 0 && cv._hover < view.length){
      const x = Math.round(P.l + slot*cv._hover + slot/2) + .5;
      c.strokeStyle = txt; c.globalAlpha = .4; c.setLineDash([3,3]);
      c.beginPath(); c.moveTo(x, P.t); c.lineTo(x, P.t+ih); c.stroke();
      c.setLineDash([]); c.globalAlpha = 1;
    }
  };
  cv._view = view; cv._run = run;
  if(!cv._bound) bindCandleTip(cv);
  animate(650, run);
}
function shortMoney(v){
  const usdt = S.settings.cur === 'USDT';
  let n = usdt ? v/rate() : v;
  const sign = n < 0 ? '−' : '';
  n = Math.abs(n);
  let s;
  if(n >= 1e7) s = (n/1e7).toFixed(1) + 'Cr';
  else if(n >= 1e5) s = (n/1e5).toFixed(1) + 'L';
  else if(n >= 1e3) s = (n/1e3).toFixed(1) + 'K';
  else s = n.toFixed(n < 10 ? 1 : 0);
  return sign + (usdt ? '' : '৳') + s;
}
function bindCandleTip(cv){
  cv._bound = true; cv._hover = -1;
  const tip = cv.parentElement.querySelector('.tip');
  const move = e => {
    const r = cv.getBoundingClientRect(), P = {l:8, r:66};
    const iw = r.width - P.l - P.r, x = e.clientX - r.left - P.l;
    const i = clamp(Math.floor(x/iw*cv._view.length), 0, cv._view.length-1);
    const d = cv._view[i];
    if(cv._hover !== i){ cv._hover = i; cv._run(1); }
    const ch = d.c - d.o, pc = d.o !== 0 ? Math.abs(ch/d.o*100).toFixed(2) : '0.00';
    tip.innerHTML = `${fdate(d.d,{weekday:'short',day:'numeric',month:'short'})}<br>O ${money(d.o)} · C ${money(d.c)}<br>H ${money(d.h)} · L ${money(d.l)}<br><span class="${ch>0?'pos':ch<0?'neg':''}">${money(ch,{sign:true})} (${ch>=0?'+':'−'}${pc}%)</span>`;
    tip.style.opacity = 1;
    tip.style.left = clamp(e.clientX - r.left - tip.offsetWidth/2, 6, r.width - tip.offsetWidth - 6) + 'px';
  };
  const leave = () => { tip.style.opacity = 0; cv._hover = -1; cv._run(1); };
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerdown', move);
  cv.addEventListener('pointerleave', leave);
}
function drawDonut(ent, pal, total){
  const cv = $('#donut'), c = cv.getContext('2d'), SZ = 50;
  animate(800, k => {
    c.clearRect(0, 0, SZ, SZ);
    c.lineWidth = 9;
    c.strokeStyle = cssVar('--bg2'); c.beginPath(); c.arc(25, 25, 19, 0, Math.PI*2); c.stroke();
    let a = -Math.PI/2;
    ent.forEach(([_, v], i) => { const sw = v/total*Math.PI*2*k; c.strokeStyle = pal[i%pal.length]; c.beginPath(); c.arc(25, 25, 19, a, a+sw); c.stroke(); a += sw; });
    const img = c.getImageData(0, 0, SZ, SZ), d = img.data;
    for(let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;

function receiptData(kind, o){

function drawReceipt(d){
  const W = 620, cv = document.createElement('canvas');
  const paper = '#f7f2e6', ink = '#191630', soft = '#6b6480';
  const accent = d.kind === 'in' ? '#0f9d58' : d.kind === 'out' ? '#d93025' : '#7b46d6';
  const rows = [
    [t('rNo'), d.no],
    [t('date'), fdate(d.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'})],
    [t('rTime'), d.time],
    [t('rType'), d.kind === 'in' ? t('rcptDep') : d.kind === 'out' ? t('rcptWd') : t('rcptPay')],
    [d.kind === 'pay' ? t('rPerson') : t('rCat'), d.line1]
  ];
  if(d.line2) rows.push(['', d.line2]);
  if(d.note) rows.push([t('rNote'), d.note]);
  rows.push([t('rRate'), '1 USDT = ৳' + rate()]);
  if(d.balance != null) rows.push([t('rBal'), money(d.balance, {cur:'TK'})]);
  const H = 300 + rows.length*38 + 150;
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = paper; c.fillRect(0, 0, W, H);
  // torn edges
  c.fillStyle = '#00000000';
  const tear = (yBase, dir) => { c.fillStyle = paper; c.beginPath(); for(let x = 0; x <= W; x += 20){ c.lineTo(x, yBase + (x/20 % 2 ? 0 : 12*dir)); } c.lineTo(W, yBase - 30*dir); c.lineTo(0, yBase - 30*dir); c.closePath(); c.fill(); };
  c.fillStyle = accent; c.fillRect(0, 0, W, 10);
  c.fillStyle = ink; c.textAlign = 'center';
  c.font = '700 40px "Pixelify Sans","Chakra Petch",sans-serif';
  c.fillText('VAULTA', W/2, 76);
  c.font = '500 16px "Hind Siliguri",sans-serif'; c.fillStyle = soft;
  c.fillText(t('receipt').toUpperCase(), W/2, 102);
  c.strokeStyle = ink; c.globalAlpha = .25;
  c.beginPath(); c.setLineDash([6,6]); c.moveTo(40, 124); c.lineTo(W-40, 124); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  // amount
  c.fillStyle = accent; c.font = '700 46px "Chakra Petch",sans-serif';
  c.fillText((d.kind === 'in' ? '+ ' : d.kind === 'out' ? '− ' : '') + money(d.amount, {cur:'TK'}), W/2, 186);
  c.fillStyle = soft; c.font = '500 18px "Chakra Petch",sans-serif';
  c.fillText(money(d.amount, {cur:'USDT'}), W/2, 214);
  let y = 262;
  c.textAlign = 'left';
  rows.forEach(([k, v]) => {
    c.fillStyle = soft; c.font = '500 15px "Hind Siliguri",sans-serif';
    c.fillText(k, 46, y);
    c.fillStyle = ink; c.font = '600 17px "Hind Siliguri",sans-serif'; c.textAlign = 'right';
    const val = String(v);
    c.fillText(val.length > 34 ? val.slice(0, 33) + '…' : val, W-46, y);
    c.textAlign = 'left';
    c.globalAlpha = .12; c.strokeStyle = ink;
    c.beginPath(); c.moveTo(46, y+11); c.lineTo(W-46, y+11); c.stroke(); c.globalAlpha = 1;
    y += 38;
  });
  // pixel code block
  y += 14;
  const seed = sha256(d.no + d.amount);
  const cell = 9, grid = 14, gx = W/2 - grid*cell/2;
  c.fillStyle = ink;
  for(let r = 0; r < grid; r++) for(let col = 0; col < grid; col++){
    const bit = parseInt(seed[(r*grid+col) % seed.length], 16);
    if(bit % 2 === 0) c.fillRect(gx + col*cell, y + r*cell, cell-1, cell-1);
  }
  y += grid*cell + 34;
  c.textAlign = 'center'; c.fillStyle = soft; c.font = '500 14px "Hind Siliguri",sans-serif';
  c.fillText(t('rThanks'), W/2, y);
  c.fillStyle = accent; c.fillRect(0, H-10, W, 10);
  return cv;
}

  }
  const doorPos = new THREE.Vector3(0, .85, -.85);
  V.income = k => {

    R.render(scene, cam);
  }
  requestAnimationFrame(frame);
}

let stars = [], conf = [];
const sCtx = $('#stars').getContext('2d'), cCtx = $('#confetti').getContext('2d');
function sizeLayers(){
  for(const id of ['#stars', '#confetti']){ const cv = $(id); cv.width = innerWidth; cv.height = innerHeight; }
  stars = Array.from({length: innerWidth < 600 ? 40 : 80}, () => ({x: rnd(0, innerWidth)|0, y: rnd(0, innerHeight*.75)|0, s: Math.random() < .2 ? 3 : 2, p: rnd(0, 6), v: rnd(.04, .22)}));
}
let shoot = null, lastT = 0;
function fxLoop(now){
  requestAnimationFrame(fxLoop);
  if(now - lastT < 48 && !conf.length) return;
  const dt = Math.min(3, (now-lastT)/16.7); lastT = now;
  sCtx.clearRect(0, 0, innerWidth, innerHeight);
  const a1 = cssVar('--a1'), txt = cssVar('--text');
  for(const s of stars){
    s.p += .05*dt; s.x += s.v*dt; if(s.x > innerWidth) s.x = 0;
    if(Math.sin(s.p) < -.3) continue;
    sCtx.fillStyle = s.s === 3 ? a1 : txt; sCtx.globalAlpha = s.s === 3 ? .75 : .4;
    sCtx.fillRect(Math.round(s.x), s.y, s.s, s.s);
  }
  sCtx.globalAlpha = 1;
  if(!shoot && Math.random() < .004) shoot = {x: rnd(0, innerWidth), y: rnd(0, innerHeight*.3), l:0};
  if(shoot){
    shoot.l += dt;
    for(let k = 0; k < 8; k++){ sCtx.globalAlpha = 1-k/8; sCtx.fillStyle = cssVar('--a3'); sCtx.fillRect((shoot.x+shoot.l*14-k*8)|0, (shoot.y+shoot.l*6-k*3.4)|0, 4, 4); }
    sCtx.globalAlpha = 1;
    if(shoot.l > 50) shoot = null;
  }
  if(conf.length){
    cCtx.clearRect(0, 0, innerWidth, innerHeight);
    conf = conf.filter(c => c.life > 0);
    for(const c of conf){ c.vy += .3*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.life -= dt; cCtx.globalAlpha = Math.min(1, c.life/25); cCtx.fillStyle = c.c; cCtx.fillRect(c.x|0, c.y|0, c.s, c.s); }
    cCtx.globalAlpha = 1;
    if(!conf.length) cCtx.clearRect(0, 0, innerWidth, innerHeight);
  }
}
function confetti(){
  if(reduce) return;
  const cols = [cssVar('--a1'), cssVar('--a2'), cssVar('--a3'), cssVar('--good')];
  for(let i = 0; i < 130; i++){ const a = rnd(-Math.PI, 0), sp = rnd(6, 15);
    conf.push({x:innerWidth/2, y:innerHeight*.6, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, s:Math.random() < .5 ? 6 : 9, c:cols[i%4], life:rnd(70, 110)}); }
}
function wipe(mid){
  if(reduce){ mid(); return; }
  const cv = $('#wipe'), x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const B = 36, cols = Math.ceil(innerWidth/B), rows = Math.ceil(innerHeight/B), cells = [];
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++) cells.push([c, r, (c/cols + r/rows)*.6 + Math.random()*.4]);
  cells.sort((a, b) => a[2]-b[2]);
  const pal = [cssVar('--a1'), cssVar('--a2'), cssVar('--bg2'), cssVar('--a3')], N = cells.length, dur = 220;
  let phase = 0, t0 = performance.now();
  const draw = (from, to) => { for(let i = from; i < to; i++){ const [c, r] = cells[i]; x.fillStyle = pal[(c*7+r*3)%4]; x.fillRect(c*B, r*B, B, B); } };
  (function f(now){
    const p = Math.min(1, (now-t0)/dur);
    x.clearRect(0, 0, cv.width, cv.height);
    if(phase === 0){ draw(0, Math.floor(p*N)); if(p >= 1){ draw(0, N); mid(); phase = 1; t0 = now; } }
    else { draw(Math.floor(p*N), N); if(p >= 1){ x.clearRect(0, 0, cv.width, cv.height); return; } }
    requestAnimationFrame(f);
  })(performance.now());
}
function sparks(x, y, n, cols, spread = 46){

/* pixel cursor */
function pixelCursor(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const arrow = ['K...........','KK..........','KWK.........','KWWK........','KWWWK.......','KWWWWK......','KWWWWWK.....','KWWWWWWK....','KWWWWWWWK...','KWWWWWKKKK..','KWWKWWK.....','KWK.KWWK....','KK..KWWK....','K....KWWK...','.....KWWK...','......KK....'];
  const hand = ['....KK......','...KWWK.....','...KWWK.....','...KWWK.....','...KWWK.....','...KWWKKK...','...KWWKWWKK.','...KWWKWWKWK','KK.KWWKWWKWK','KWKKWWWWWWWK','KWWKWWWWWWWK','.KWWWWWWWWWK','..KWWWWWWWWK','..KWWWWWWWK.','...KWWWWWWK.','...KKKKKKKK.'];
  const build = (rows, fill) => {
    const c = document.createElement('canvas'); c.width = 12*2; c.height = 16*2;
    const x = c.getContext('2d');
    rows.forEach((row, r) => [...row].forEach((ch, col) => {
      if(ch === '.') return;
      x.fillStyle = ch === 'K' ? '#0a0614' : fill;
      x.fillRect(col*2, r*2, 2, 2);
    }));
    return c.toDataURL();
  };
  const st = document.createElement('style');
  const upd = () => {
    const a = build(arrow, cssVar('--text')), hd = build(hand, cssVar('--a3'));
    st.textContent = `body,body *{cursor:url(${a}) 1 1,auto}
      a,button,label,.pb,.cat,.th,.owe,.person,.me,.bank,[role=button],[data-goto],[data-tab],[data-pay],[data-del],[data-rcpt],[data-ddel],[data-drcpt],[data-theme],[data-lang]{cursor:url(${hd}) 8 2,pointer}
      input,select,textarea{cursor:auto}`;
  };
  document.head.appendChild(st);
  upd();
  pixelCursor.update = upd;
}

}
const openModal = id => $('#'+id).classList.add('open');
const closeModal = id => $('#'+id).classList.remove('open');
function shake(el){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}], {duration:280, easing:'steps(4)'}); }
const toTK = (v, cur) => Math.round((cur === 'USDT' ? v*rate() : v)*100)/100;
function conv(ai, ci, oi){
  const v = parseFloat($(ai).value);
  if(!(v > 0)){ $(oi).textContent = `1 USDT = ৳${rate()}`; return; }
  const tk = toTK(v, $(ci).value);
  $(oi).textContent = `= ${money(tk,{cur:'TK'})}  ·  ${money(tk,{cur:'USDT'})}`;
}
function openTx(){
  $('#aAmt').value = ''; $('#aNote').value = ''; $('#aDate').value = today(); $('#aCur').value = S.settings.cur;
  setTxType('in'); openModal('mTx');
  setTimeout(() => $('#aAmt').focus(), 300);
}
function setTxType(tp){
  txType = tp; txCat = CATS[tp][0].id;
  $$('#txType button').forEach(b => b.classList.toggle('on', b.dataset.t === tp));
  $('#aSave').className = 'pb ' + (tp === 'in' ? 'green' : 'red');
  renderCats(); conv('#aAmt', '#aCur', '#aConv');
}
function renderCats(){
  $('#aCats').innerHTML = CATS[txType].map(c => `<button class="cat ${c.id === txCat ? 'on' : ''}" data-c="${c.id}">${pxImg(c.e)}${esc(catName(c))}</button>`).join('');
}
function saveTx(){
  const v = parseFloat($('#aAmt').value);
  if(!(v > 0)){ toast(t('enterAmt')); shake($('#mTx .amtbox')); return; }
  const amt = toTK(v, $('#aCur').value), date = $('#aDate').value || today();
  const tx = {id: uid(), type: txType, amt, cat: txCat, note: $('#aNote').value.trim(), date, ts: Date.now()};
  S.txs.push(tx); save();
  const src = $('#aSave').getBoundingClientRect();
  closeModal('mTx');
  const target = isTab('home') ? $('#balance') : $('#bnav [data-tab="home"]');
  const k = clamp(3 + Math.floor(Math.log10(amt+1)*1.5), 3, 8);
  V.hold = 1200;
  const after = () => {
    const bal = totals().bal;
    showReceipt(receiptData(tx.type, {id:tx.id, amount:amt, line1:catName(catOf(tx.type, tx.cat)), note:tx.note, date, balance:bal}), true);
  };
  if(txType === 'in'){
    V.income(k);
    flyCoins(src, target.getBoundingClientRect(), k).then(() => { render(); heroHit('up', amt); setTimeout(after, 500); });
    toast(t('addedIn'));
  } else {
    render(); heroHit('down', amt);
    flyBills(target.getBoundingClientRect(), k);
    V.expense(k);
    toast(t('addedOut'));
    setTimeout(after, 1100);
  }
}
function removeRow(sel, after){
  const rows = $$(sel);
  if(!rows.length || reduce){ after(); return; }
  rows.forEach(r => r.classList.add('out-anim'));
  setTimeout(after, 360);
}
function delTx(id){
  if(!confirm(t('delQ'))) return;
  const b = $(`[data-del="${id}"]`);
  if(b){ const r = b.getBoundingClientRect(); sparks(r.left+16, r.top+16, 10, [cssVar('--bad'), cssVar('--a2')]); }
  removeRow(`.tx[data-id="${id}"]`, () => { S.txs = S.txs.filter(x => x.id !== id); save(); render(); toast(t('deleted')); });
}
function openDebt(){
  ['#dName', '#dAmt', '#dNote', '#dDue'].forEach(s => $(s).value = '');
  $('#dDate').value = today(); $('#dCur').value = S.settings.cur;
  setDir(ledFilter === 'give' ? 'give' : 'get');
  conv('#dAmt', '#dCur', '#dConv');
  openModal('mDebt');
  setTimeout(() => $('#dName').focus(), 300);
}
function setDir(d){ debtDir = d; $$('#dDir button').forEach(b => b.classList.toggle('on', b.dataset.d === d)); }
function saveDebt(){
  const name = $('#dName').value.trim(), v = parseFloat($('#dAmt').value);
  if(!name){ toast(t('enterName')); shake($('#dName')); return; }
  if(!(v > 0)){ toast(t('enterAmt')); shake($('#mDebt .amtbox')); return; }
  S.debts.push({id: uid(), dir: debtDir, name, amt: toTK(v, $('#dCur').value), paid:0, pays:[], note: $('#dNote').value.trim(), date: $('#dDate').value || today(), due: $('#dDue').value || '', ts: Date.now()});
  save();
  const r = $('#dSave').getBoundingClientRect();
  closeModal('mDebt');
  ledFilter = debtDir; syncSeg('#ledFilter', ledFilter);
  if(!isTab('ledger')) go('ledger');
  render();
  const dst = (debtDir === 'get' ? $('#lGet') : $('#lGive')).getBoundingClientRect();
  if(dst.width) flyer('🤝', [{transform:`translate(${r.left+r.width/2}px,${r.top}px) scale(.5)`, opacity:0},
    {transform:`translate(${innerWidth/2}px,${innerHeight/2-60}px) scale(3)`, opacity:1, offset:.5},
    {transform:`translate(${dst.left+30}px,${dst.top+10}px) scale(.8)`, opacity:0}],
    {duration:950, easing:'steps(12)'}, () => sparks(dst.left+30, dst.top+10, 10, [cssVar('--a1'), cssVar('--a2'), cssVar('--a3')]));
  toast(t('debtAdded'));
}
function openPay(id){
  const d = S.debts.find(x => x.id === id); if(!d) return;
  payId = id;
  $('#sCur').value = S.settings.cur; $('#sAmt').value = ''; $('#sAmt').dataset.full = '';
  $('#pInfo').textContent = t(d.dir === 'get' ? 'payInfoGet' : 'payInfoGive', {n:d.name, a:money(remain(d))});
  openModal('mPay');
  setTimeout(() => $('#sAmt').focus(), 300);
}
function quickPay(q){
  const d = S.debts.find(x => x.id === payId); if(!d) return;
  const tk = remain(d)*q;
  $('#sAmt').value = $('#sCur').value === 'USDT' ? +(tk/rate()).toFixed(2) : +tk.toFixed(2);
  $('#sAmt').dataset.full = q === 1 ? '1' : '';
}
function savePay(){
  const d = S.debts.find(x => x.id === payId); if(!d) return;
  const v = parseFloat($('#sAmt').value);
  if(!(v > 0)){ toast(t('enterAmt')); shake($('#mPay .amtbox')); return; }
  let tk = toTK(v, $('#sCur').value);
  if($('#sAmt').dataset.full === '1' || tk > remain(d) - .01) tk = remain(d);
  d.paid = Math.round(((d.paid||0) + tk)*100)/100;
  d.pays = [...(d.pays||[]), {amt:tk, date:today()}];
  const full = remain(d) <= .004;
  if(full) d.doneTs = Date.now();
  save(); closeModal('mPay');
  V.paid && V.paid();
  const card = $(`.debt[data-id="${d.id}"]`);
  const rcpt = () => showReceipt(receiptData('pay', {id:d.id, amount:tk, line1:d.name,
    line2:(d.dir === 'get' ? t('dirGet') : t('dirGive')) + ' · ' + t('left') + ' ' + money(remain(d)), note:d.note, date:today(), balance:null}), true);
  if(full && card){
    card.insertAdjacentHTML('beforeend', '<div class="stamp new">PAID</div>');
    const r = card.getBoundingClientRect();
    sparks(r.right-80, r.top+r.height/2, 18, [cssVar('--good'), cssVar('--a3')], 80);
    confetti(); toast(t('fullyPaid'));
    setTimeout(() => removeRow(`.debt[data-id="${d.id}"]`, () => { render(); rcpt(); }), 900);
  } else {
    if(card){ const r = card.getBoundingClientRect(); sparks(r.left+r.width/2, r.top+r.height-30, 12, [cssVar('--good')], 60); }
    render(); toast(t('paySaved')); setTimeout(rcpt, 400);
  }
}
function delDebt(id){
  if(!confirm(t('delQ'))) return;
  removeRow(`.debt[data-id="${id}"]`, () => { S.debts = S.debts.filter(x => x.id !== id); save(); render(); toast(t('deleted')); });
}
const syncSeg = (sel, val) => $$(sel+' button').forEach(b => b.classList.toggle('on', b.dataset.f === val));
function setLang(l){
  if(S.settings.lang === l) return;
  S.settings.lang = l; save();
  wipe(() => { applyI18n(); if(!$('#app').classList.contains('hide')){ render(); renderCats(); } toast(t('langSet')); });
}
function setTheme(k){
  S.settings.theme = k; save();
  wipe(() => { render(); sizeLayers(); V.repaint(); pixelCursor.update && pixelCursor.update(); });
}
function saveProfile(){
  const name = $('#fName').value.trim();
  if(!name){ toast(t('enterName')); shake($('#fName')); return; }
  S.profile = {...(S.profile||{}), name, start: $('#fStart').value || today(), startBal: parseFloat($('#fBal').value) || 0};
  const r = parseFloat($('#fRate').value);
  S.settings.rate = r > 0 ? r : 125;
  S.settings.goal = parseFloat($('#fGoal').value) || 0;
  S.settings.autoRcpt = $('#fRcpt').checked;
  save(); render(); toast(t('saved'));
  const b = $('#saveProfileBtn').getBoundingClientRect();
  sparks(b.left+b.width/2, b.top+b.height/2, 16, [cssVar('--a1'), cssVar('--a3')], 70);
}
function saveAuth(){
  const old = $('#cOld').value, u = $('#cUser').value.trim(), p = $('#cNew').value;
  if(!checkAuth(auth.user, old)){ toast(t('errWrong')); shake($('#cOld')); return; }
  if(!u){ toast(t('errUser')); shake($('#cUser')); return; }
  if(p.length < 4){ toast(t('errShort')); shake($('#cNew')); return; }
  setAuth(u, p, localStorage.getItem(RKEY) === '1');
  $('#cOld').value = $('#cNew').value = '';
  toast(t('authSaved'));
}
function finishIntro(){
  const name = $('#iName').value.trim();
  if(!name){ toast(t('enterName')); shake($('#iName')); return; }
  S.profile = {name, photo: introPhoto?.photo || null, start: $('#iStart').value || today(), startBal: parseFloat($('#iBal').value) || 0};
  save(); closeModal('mIntro');
  wipe(() => { render(); confetti(); toast(t('welcome', {n:name})); });
}
function openIntro(){
  introPhoto = null;
  $('#iAva').innerHTML = `<div class="ph">${pxImg('📷')}</div>`;
  $('#iStart').value = today(); $('#iName').value = ''; $('#iBal').value = '';
  openModal('mIntro');
}
function exportJSON(){
  const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}));
  download(url, `vaulta-backup-${today()}.json`);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(t('exported'));
}
function resetAll(){
  if(!confirm(t('resetQ'))) return;
  const lang = S.settings.lang, theme = S.settings.theme;
  S = defState(); S.settings.lang = lang; S.settings.theme = theme; save();
  wipe(() => { render(); openIntro(); });
}

/* ================= LOCK ================= */
function startApp(first){
  $('#lock').classList.add('hide');
  ['#app', '#fab', '#bnav'].forEach(s => $(s).classList.remove('hide'));
  render();
  if(!V.started){ V.started = true; initBank(); }
  if(!S.profile) openIntro();
  if(!first) toast(t('unlocked'));
}
function lockNow(){
  localStorage.removeItem(RKEY);
  $('#lpass').value = ''; $('#lpass2').value = ''; $('#lerr').textContent = '';
  $('#doorAnim').classList.remove('open');
  ['#app', '#fab', '#bnav'].forEach(s => $(s).classList.add('hide'));
  $$('.modal').forEach(m => m.classList.remove('open'));
  $('#lock').classList.remove('hide');
  applyI18n();
  toast(t('locked'));
}
function tryUnlock(){
  const u = $('#luser').value.trim(), p = $('#lpass').value, err = $('#lerr');
  err.textContent = '';
  if(!auth){
    if(!u){ err.textContent = t('errUser'); shake($('#luser')); return; }
    if(p.length < 4){ err.textContent = t('errShort'); shake($('#lpass')); return; }
    if(p !== $('#lpass2').value){ err.textContent = t('errMatch'); shake($('#lpass2')); return; }
    setAuth(u, p, $('#lremember').checked);
    applyI18n();
  } else {
    if(!checkAuth(u, p)){ err.textContent = t('errWrong'); shake($('.lockbox')); return; }
    if($('#lremember').checked) localStorage.setItem(RKEY, '1'); else localStorage.removeItem(RKEY);
  }
  $('#doorAnim').classList.add('open');
  sparks(innerWidth/2, innerHeight/2, 16, [cssVar('--a1'), cssVar('--a3')], 90);
  setTimeout(() => wipe(() => startApp(false)), reduce ? 0 : 750);
}

/* ================= EVENTS ================= */
$('#bnav').onclick = e => { const b = e.target.closest('button'); if(b) go(b.dataset.tab); };
$('#meBtn').onclick = () => go('profile');
$('#meBtn').onkeydown = e => { if(e.key === 'Enter') go('profile'); };
$('#fab').onclick = () => isTab('ledger') ? openDebt() : openTx();
$('#addDebtBtn').onclick = openDebt;
$('#lockBtn').onclick = lockNow;
$('#lockNowBtn').onclick = lockNow;
$('#langBtn').onclick = () => setLang(S.settings.lang === 'bn' ? 'en' : 'bn');
$('#lLangBtn').onclick = () => setLang(S.settings.lang === 'bn' ? 'en' : 'bn');
$('#lgo').onclick = tryUnlock;
$('#lpass').onkeydown = $('#luser').onkeydown = $('#lpass2').onkeydown = e => { if(e.key === 'Enter') tryUnlock(); };
$$('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$$('#curSwitch button').forEach(b => b.onclick = () => {
  if(S.settings.cur === b.dataset.c) return;
  S.settings.cur = b.dataset.c; save(); render();
  toast(b.dataset.c === 'USDT' ? t('curU', {r:rate()}) : t('curT'));
});
$('#txType').onclick = e => { const b = e.target.closest('button'); if(b) setTxType(b.dataset.t); };
$('#aCats').onclick = e => { const b = e.target.closest('.cat'); if(b){ txCat = b.dataset.c; renderCats(); } };
$('#aAmt').oninput = $('#aCur').onchange = () => conv('#aAmt', '#aCur', '#aConv');
$('#aAmt').onkeydown = e => { if(e.key === 'Enter') saveTx(); };
$('#aSave').onclick = saveTx;
$('#dDir').onclick = e => { const b = e.target.closest('button'); if(b) setDir(b.dataset.d); };
$('#dAmt').oninput = $('#dCur').onchange = () => conv('#dAmt', '#dCur', '#dConv');
$('#dSave').onclick = saveDebt;
$('#sQuick').onclick = e => { const b = e.target.closest('button'); if(b) quickPay(Number(b.dataset.q)); };
$('#sAmt').oninput = () => $('#sAmt').dataset.full = '';
$('#sCur').onchange = () => { $('#sAmt').value = ''; $('#sAmt').dataset.full = ''; };
$('#sSave').onclick = savePay;
$('#rcptDl').onclick = () => { if(rcptURL){ download(rcptURL, rcptName); toast(t('rcptSaved')); } };
$('#txFilter').onclick = e => { const b = e.target.closest('button'); if(!b) return; txFilter = b.dataset.f; syncSeg('#txFilter', txFilter); renderTxTab(); };
$('#ledFilter').onclick = e => { const b = e.target.closest('button'); if(!b) return; ledFilter = b.dataset.f; syncSeg('#ledFilter', ledFilter); render(); };
$('#txSearch').oninput = renderTxTab;
$('#txMonth').onchange = renderTxTab;
$('#repMonth').onchange = () => renderMarket(buildSeries(), dayMap());
$('#tfSeg').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.settings.tf = b.dataset.tf; save(); renderMarket(buildSeries(), dayMap()); };
$('#modeSeg').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.settings.mode = b.dataset.m; save(); renderMarket(buildSeries(), dayMap()); };
$('#maSeg').onclick = () => { S.settings.ma = !S.settings.ma; save(); renderMarket(buildSeries(), dayMap()); };
$('#themes').onclick = e => { const b = e.target.closest('[data-theme]'); if(b) setTheme(b.dataset.theme); };
$('#saveProfileBtn').onclick = saveProfile;
$('#saveAuthBtn').onclick = saveAuth;
$('#exportBtn').onclick = exportJSON;
$('#resetBtn').onclick = resetAll;
$('#csvTx').onclick = () => csvTx(filteredTx());
$('#csvDebt').onclick = csvDebts;
$('#csvDaily').onclick = csvDaily;
$('#csvAll').onclick = () => { csvTx(); setTimeout(csvDebts, 400); setTimeout(csvDaily, 800); };
$('#iGo').onclick = finishIntro;
document.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if(g){ e.preventDefault(); return go(g.dataset.goto); }
  const del = e.target.closest('[data-del]'); if(del) return delTx(del.dataset.del);
  const rc = e.target.closest('[data-rcpt]'); if(rc) return txReceipt(rc.dataset.rcpt);
  const dr = e.target.closest('[data-drcpt]'); if(dr) return debtReceipt(dr.dataset.drcpt);
  const pay = e.target.closest('[data-pay]'); if(pay) return openPay(pay.dataset.pay);
  const dd = e.target.closest('[data-ddel]'); if(dd) return delDebt(dd.dataset.ddel);
  const cl = e.target.closest('[data-close]'); if(cl) return closeModal(cl.closest('.modal').id);
  if(e.target.classList.contains('modal') && e.target.id !== 'mIntro') closeModal(e.target.id);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') ['mTx','mDebt','mPay','mRcpt'].forEach(closeModal); });
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.pb,.cat,.fseg button,.two button,.th,#bnav button');
  if(b) sparks(e.clientX, e.clientY, 8, [cssVar('--a1'), cssVar('--a2'), cssVar('--a3')]);
});
$('#pAva').onclick = () => { photoTarget = 'profile'; $('#photoInput').click(); };
$('#iAva').onclick = () => { photoTarget = 'intro'; $('#photoInput').click(); };
$('#photoInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try{
    const ph = await readPhoto(f);
    if(photoTarget === 'intro'){ introPhoto = ph; $('#iAva').innerHTML = avatar(ph.photo); }
    else {
      S.profile = {...(S.profile || {name:t('guest'), start:today(), startBal:0}), ...ph};
      save(); render(); toast(t('photoOk'));
      const r = $('#pAva').getBoundingClientRect();
      sparks(r.left+r.width/2, r.top+r.height/2, 20, [cssVar('--a1'), cssVar('--a2'), cssVar('--a3')], 90);
    }
  }catch(err){ toast(t('photoBad')); }
};
$('#importFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.txs)) throw 0;
      if(!confirm(t('importQ'))) return;
      S = normalize(d); save(); wipe(render); toast(t('importOk'));
    }catch(err){ toast(t('importBad')); }
  };
  r.readAsText(f);
};
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { sizeLayers(); if(!$('#app').classList.contains('hide')) render(); }, 200); });

/* ================= INIT ================= */
(function init(){
  $('#gbar').innerHTML = '<i></i>'.repeat(20);
  $$('[data-ic]').forEach(el => { const src = pxe(el.dataset.ic); if(el.tagName === 'IMG') el.src = src; else el.innerHTML = `<img class="pxi" src="${src}" alt="">`; });
  $('#repMonth').value = today().slice(0, 7);
  $('#txMonth').value = '';
  document.documentElement.dataset.theme = S.settings.theme;
  applyI18n();
  sizeLayers();
  requestAnimationFrame(fxLoop);
  pixelCursor();
  if(auth && localStorage.getItem(RKEY) === '1'){ $('#doorAnim').classList.add('open'); startApp(true); }
  if(document.fonts) document.fonts.ready.then(() => { if(!$('#app').classList.contains('hide')) render(); });
})();
</script>
</body>
