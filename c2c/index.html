<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Collection Generator - Super Fast</title>
    <!-- JSZip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #00cec9;
            --secondary: #74b9ff;
            --bg: #1e272e;
            --surface: #2d3436;
            --text: #dfe6e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background-color: var(--surface); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 100%; max-width: 650px; border: 1px solid #454d50; }
        h2 { text-align: center; margin-bottom: 25px; color: var(--primary); }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #b2bec3; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #636e72; background-color: #1e272e; color: white; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), #0984e3); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:disabled { background: #636e72; cursor: not-allowed; transform: none; }
        
        #status-text { margin-top: 15px; text-align: center; font-weight: bold; color: #ffeaa7; }
        
        .download-section { margin-top: 30px; display: none; padding-top: 20px; border-top: 1px solid #636e72; }
        .batch-btn { background: linear-gradient(135deg, #6c5ce7, #a29bfe); margin-bottom: 10px; }
        .csv-btn { background: linear-gradient(135deg, #00b894, #55efc4); margin-bottom: 20px; color: #2d3436; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Fast NFT Generator</h2>
    
    <div class="input-group">
        <label>WebP ছবি আপলোড করুন</label>
        <input type="file" id="imageUpload" accept="image/webp" multiple>
    </div>

    <div class="input-group">
        <label>আউটপুট ফরম্যাট</label>
        <select id="formatSelect">
            <option value="png">PNG</option>
            <option value="jpeg">JPG</option>
        </select>
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="input-group" style="flex: 1;">
            <label>মোট ছবির সংখ্যা</label>
            <input type="number" id="totalAmount" placeholder="10000" value="10000" min="1">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>প্রতি ব্যাচে কতগুলো (যেমন: 1000)</label>
            <input type="number" id="batchSize" placeholder="1000" value="1000" min="1">
        </div>
    </div>

    <div class="input-group">
        <label>মেটাডেটা নাম (যেমন: 8BIT BROKER)</label>
        <input type="text" id="baseName" placeholder="8BIT BROKER">
    </div>

    <button id="prepareBtn">ফাইলের সিস্টেম প্রস্তুত করুন</button>
    <div id="status-text"></div>

    <div class="download-section" id="downloadSection">
        <h3 style="text-align: center; margin-bottom: 15px; color: #fdcb6e;">ডাউনলোড প্যানেল</h3>
        <button id="downloadFullCsvBtn" class="csv-btn">📥 সম্পূর্ণ "NFTMETADATA.csv" ডাউনলোড করুন</button>
        <div id="batchButtonsContainer"></div>
    </div>
</div>

<script>
    let convertedBlobs = [];
    let config = {};

    document.getElementById('prepareBtn').addEventListener('click', async () => {
        const files = document.getElementById('imageUpload').files;
        config.format = document.getElementById('formatSelect').value;
        config.ext = config.format === 'jpeg' ? 'jpg' : 'png';
        config.totalAmount = parseInt(document.getElementById('totalAmount').value);
        config.batchSize = parseInt(document.getElementById('batchSize').value);
        config.baseName = document.getElementById('baseName').value.trim();

        if (files.length === 0) return alert('অন্তত একটি ছবি আপলোড করুন!');
        if (!config.totalAmount || !config.batchSize) return alert('সংখ্যা সঠিকভাবে দিন!');
        if (!config.baseName) return alert('বেস নাম দিন!');

        const prepareBtn = document.getElementById('prepareBtn');
        const statusText = document.getElementById('status-text');
        
        prepareBtn.disabled = true;
        statusText.innerText = "মূল ছবিগুলো কনভার্ট করা হচ্ছে, অপেক্ষা করুন...";
        convertedBlobs = []; // Reset

        // ১. ছবি লোড করা
        const loadImages = Array.from(files).map(file => {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = url;
            });
        });
        const loadedImages = await Promise.all(loadImages);

        // ২. মাত্র একবার কনভার্ট করে মেমোরিতে রাখা (সুপার ফাস্ট)
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        for (let i = 0; i < loadedImages.length; i++) {
            statusText.innerText = `কনভার্ট হচ্ছে: অরিজিনাল ছবি ${i+1}/${loadedImages.length}`;
            const img = loadedImages[i];
            canvas.width = img.width;
            canvas.height = img.height;

            if (config.format === 'jpeg') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            
            ctx.drawImage(img, 0, 0);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, `image/${config.format}`, 1.0));
            convertedBlobs.push(blob);
        }

        // ৩. ব্যাচ বাটন তৈরি করা
        statusText.innerText = "সিস্টেম প্রস্তুত! এখন নিচে থেকে ডাউনলোড করুন।";
        prepareBtn.disabled = false;
        
        generateDownloadUI();
    });

    function generateDownloadUI() {
        const downloadSection = document.getElementById('downloadSection');
        const container = document.getElementById('batchButtonsContainer');
        container.innerHTML = ''; // Clear previous
        
        downloadSection.style.display = 'block';

        const totalBatches = Math.ceil(config.totalAmount / config.batchSize);

        for (let b = 0; b < totalBatches; b++) {
            const start = b * config.batchSize + 1;
            const end = Math.min((b + 1) * config.batchSize, config.totalAmount);
            
            const btn = document.createElement('button');
            btn.className = 'batch-btn';
            btn.innerText = `📦 ডাউনলোড পার্ট ${b + 1} (ছবি ${start} থেকে ${end})`;
            
            btn.onclick = () => downloadBatch(start, end, btn);
            container.appendChild(btn);
        }

        // সম্পূর্ণ CSV ডাউনলোড বাটন সেটআপ
        document.getElementById('downloadFullCsvBtn').onclick = downloadFullCSV;
    }

    async function downloadBatch(start, end, btnElement) {
        btnElement.disabled = true;
        const originalText = btnElement.innerText;
        btnElement.innerText = "⏳ ফাইল প্যাক করা হচ্ছে...";

        const zip = new JSZip();
        
        // শুধু জিপের কাজ, কোনো কনভার্সন নেই তাই সাথে সাথে হয়ে যাবে
        for (let i = start; i <= end; i++) {
            const blobToUse = convertedBlobs[(i - 1) % convertedBlobs.length];
            const fileName = `${i}.${config.ext}`;
            zip.file(fileName, blobToUse);
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(zipBlob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = `Images_${start}_to_${end}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        btnElement.innerText = "✅ সম্পন্ন হয়েছে!";
        setTimeout(() => { 
            btnElement.disabled = false; 
            btnElement.innerText = originalText; 
        }, 2000);
    }

    function downloadFullCSV() {
        let csvContent = "tokenID,name,description,file_name\n";
        for (let i = 1; i <= config.totalAmount; i++) {
            const fileName = `${i}.${config.ext}`;
            csvContent += `${i},"${config.baseName} #${i}",,${fileName}\n`;
        }
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "NFTMETADATA.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
